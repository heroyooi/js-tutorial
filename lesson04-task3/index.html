<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>4회차 과제 3 - 날씨 메시지</title>
  <script defer src="app.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 48px auto; line-height: 1.7; }
    select, input, button { padding: 8px; margin-right: 8px; }
    .result { padding: 12px; border: 1px solid #e5e7eb; border-radius: 10px; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>날씨 메시지 (switch)</h1>

  <label>
    날씨:
    <select id="weather">
      <option value="sunny">sunny</option>
      <option value="rainy">rainy</option>
      <option value="snowy">snowy</option>
      <option value="cloudy">cloudy</option>
      <option value="windy">windy</option>
    </select>
  </label>
  <button id="show">메시지 보기</button>

  <div class="result" id="msg"></div>
</body>
</html>
