<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Lesson 10 - Mini SPA (Modular)</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      nav {
        padding: 12px 16px;
        border-bottom: 1px solid #e5e7eb;
      }
      nav a {
        margin-right: 12px;
        text-decoration: none;
        color: #2563eb;
      }
      nav a.active {
        font-weight: 700;
        color: #dc2626;
      }
      .container {
        max-width: 720px;
        margin: 0 auto;
        padding: 20px 16px;
      }
      .controls {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      .controls input {
        flex: 1;
        padding: 8px 10px;
      }
      .controls select {
        padding: 8px 10px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px dashed #e5e7eb;
      }
      button.fav {
        border: 1px solid #e5e7eb;
        background: #fff;
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
      }
      button.fav.is-active {
        background: #fff7ed;
        border-color: #fb923c;
      }
      mark {
        background: #fde68a;
        padding: 0 2px;
        border-radius: 3px;
      }
      small.cat {
        color: #6b7280;
        margin-left: 6px;
      }
      .empty {
        color: #6b7280;
        padding: 24px 0;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="#/list">목록</a>
      <a href="#/favorites">즐겨찾기</a>
      <a href="#/about">소개</a>
    </nav>
    <main id="app" class="container"></main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
