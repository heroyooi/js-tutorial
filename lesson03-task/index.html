<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>JS 중급 3회차 – 과제 풀이</title>
  <script defer src="app.js"></script>
  <style>
    :root { --bg:#0f1115; --card:#151923; --text:#e6e8ee; --muted:#aeb3c2; --border:#2a2f3a; --accent:#4f8cff; }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui, Noto Sans KR, sans-serif}
    .wrap{max-width:980px;margin:48px auto;padding:0 20px}
    h1{margin:0 0 6px}
    p.muted{color:var(--muted);margin:0 0 20px}
    section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px}
    button{border:1px solid var(--border);background:#1d2330;color:var(--text);padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:600}
    button:hover{border-color:var(--accent)}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
    input{padding:8px;border:1px solid var(--border);border-radius:10px;background:#0f1420;color:var(--text);width:120px}
    .log{margin-top:10px;background:#0f1420;border:1px dashed var(--border);border-radius:10px;padding:10px;min-height:44px;white-space:pre-wrap}
    code{background:#0f1420;padding:2px 6px;border-radius:6px}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>중급 3회차 – 과제 풀이</h1>
    <p class="muted">제한 병렬, 폴백 전략, 지수 백오프+타임아웃을 가짜 API로 실습합니다.</p>

    <!-- 1) 제한 병렬 처리기 -->
    <section>
      <h2>① 제한 병렬 처리기</h2>
      <div class="row">
        <label>동시 실행 수
          <input id="concurrency" type="number" value="2" min="1" />
        </label>
        <button id="runLimited">작업 6개 실행</button>
      </div>
      <div id="limitedLog" class="log"></div>
    </section>

    <!-- 2) 폴백 전략 -->
    <section>
      <h2>② 폴백 전략 (1차 실패 시 2차 시도)</h2>
      <div class="row">
        <button id="runFallback">폴백 호출</button>
      </div>
      <div id="fallbackLog" class="log"></div>
    </section>

    <!-- 3) 지수 백오프 + 타임아웃 결합 -->
    <section>
      <h2>③ 지수 백오프 + 타임아웃 결합</h2>
      <div class="row">
        <label>타임아웃(ms)
          <input id="timeoutMs" type="number" value="700" min="100" />
        </label>
        <label>최대 재시도
          <input id="maxRetry" type="number" value="3" min="0" />
        </label>
        <button id="runResilient">호출</button>
      </div>
      <div id="resilientLog" class="log"></div>
    </section>
  </main>
</body>
</html>
