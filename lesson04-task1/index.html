<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>4회차 과제 1 - 학점 계산기</title>
  <script defer src="app.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 48px auto; line-height: 1.7; }
    fieldset { margin-bottom: 16px; }
    input { padding: 8px; width: 120px; }
    button { padding: 8px 12px; margin-left: 8px; }
    .result { padding: 12px; border: 1px solid #e5e7eb; border-radius: 10px; margin-top: 12px; min-height: 24px; }
    .muted { color: #6b7280; font-size: 14px; }
  </style>
</head>
<body>
  <h1>학점 계산기</h1>
  <p class="muted">점수(0~100)를 입력하고 각 버튼을 눌러 결과를 확인하세요.</p>

  <fieldset>
    <legend>입력</legend>
    <input id="score" type="number" placeholder="0~100" />
    <button id="btnIf">if/else 계산</button>
    <button id="btnSwitch">switch 계산</button>
  </fieldset>

  <div class="result" id="result"></div>
</body>
</html>
