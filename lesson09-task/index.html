<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>JS 9회차 – 과제</title>
  <script defer src="app.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 48px auto; }
    section { margin-bottom: 40px; }
    button { margin-right: 8px; }
  </style>
</head>
<body>
  <h1>JavaScript 9회차 – 과제 풀이</h1>

  <section>
    <h2>1. 자기소개 메서드</h2>
    <button id="introBtn">자기소개</button>
    <p id="introResult"></p>
  </section>

  <section>
    <h2>2. 카운터 객체</h2>
    <button id="increaseBtn">+1</button>
    <button id="decreaseBtn">-1</button>
    <p id="counterResult"></p>
  </section>

  <section>
    <h2>3. this 동작 비교</h2>
    <button id="normalFnBtn">일반 함수 this</button>
    <button id="arrowFnBtn">화살표 함수 this</button>
    <pre id="thisResult"></pre>
  </section>
</body>
</html>
