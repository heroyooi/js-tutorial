<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>4회차 과제 2 - 로그인 시뮬레이터</title>
  <script defer src="app.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 48px auto; line-height: 1.7; }
    input { padding: 8px; margin-right: 8px; }
    button { padding: 8px 12px; margin-right: 8px; }
    .status { padding: 12px; border: 1px solid #e5e7eb; border-radius: 10px; margin-top: 12px; }
    .ok { color: #2563eb; font-weight: 600; }
  </style>
</head>
<body>
  <h1>로그인 시뮬레이터</h1>

  <div>
    <input id="email" type="email" placeholder="이메일" />
    <input id="pw" type="password" placeholder="비밀번호" />
    <button id="login">로그인</button>
    <button id="logout">로그아웃</button>
  </div>

  <div class="status" id="status">상태: 로그아웃</div>
  <p class="ok">Guard Clause로 조건을 일찍 반환하는 패턴을 확인해보세요.</p>
</body>
</html>
