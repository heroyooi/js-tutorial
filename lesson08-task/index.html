<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>JS 8회차 – 과제</title>
  <script defer src="app.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 48px auto; }
    section { margin-bottom: 40px; }
    input, button { padding: 6px; margin: 4px 0; }
    ul { padding: 0; list-style: none; }
    li { background: #f8f8f8; padding: 6px; margin: 4px 0; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>JavaScript 8회차 – 과제 풀이</h1>

  <section>
    <h2>1. 상품 정보 관리</h2>
    <button id="updateStockBtn">재고 -1</button>
    <p id="productInfo"></p>
  </section>

  <section>
    <h2>2. 회원 검색 기능</h2>
    <input id="searchName" type="text" placeholder="이름 입력" />
    <button id="searchBtn">검색</button>
    <p id="searchResult"></p>
  </section>

  <section>
    <h2>3. 객체 병합</h2>
    <button id="mergeBtn">객체 병합</button>
    <pre id="mergeResult"></pre>
  </section>
</body>
</html>
