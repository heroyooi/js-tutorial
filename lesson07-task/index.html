<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>JS 7회차 – 과제</title>
  <script defer src="app.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 48px auto; line-height: 1.7; }
    h2 { margin-top: 40px; }
    input, button { padding: 6px; margin: 4px 0; }
    ul { list-style: none; padding: 0; }
    li { background: #f5f5f5; margin: 4px 0; padding: 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>JavaScript 7회차 – 과제 풀이</h1>

  <h2>1. 할 일 목록</h2>
  <input id="todoInput" type="text" placeholder="할 일 입력" />
  <button id="addTodoBtn">추가</button>
  <ul id="todoList"></ul>

  <h2>2. 숫자 통계</h2>
  <button id="calcBtn">[10, 15, 20, 25, 30] 짝수 평균 구하기</button>
  <p id="avgResult"></p>

  <h2>3. 검색 기능</h2>
  <input id="searchKeyword" type="text" placeholder="검색어 입력" />
  <button id="searchBtn">검색</button>
  <p id="searchResult"></p>
</body>
</html>
