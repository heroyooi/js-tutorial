<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>JS 중급 3회차 – 비동기 심화</title>
  <script defer src="app.js"></script>
  <style>
    :root { --bg:#0f1115; --card:#151923; --text:#e6e8ee; --muted:#aeb3c2; --border:#2a2f3a; --accent:#4f8cff; }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui, Noto Sans KR, sans-serif}
    .wrap{max-width:980px;margin:48px auto;padding:0 20px}
    h1{margin:0 0 4px}
    p.muted{color:var(--muted);margin:0 0 20px}
    .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
    button{border:1px solid var(--border);background:#1d2330;color:var(--text);padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:600}
    button:hover{border-color:var(--accent)}
    .log{margin-top:10px;background:#0f1420;border:1px dashed var(--border);border-radius:10px;padding:10px;min-height:44px;white-space:pre-wrap}
    label{display:block;margin:8px 0 4px}
    input{width:100%;padding:8px;border:1px solid var(--border);border-radius:10px;background:#0f1420;color:var(--text)}
    code{background:#0f1420;padding:2px 6px;border-radius:6px}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>중급 3회차 – 비동기 플레이그라운드</h1>
    <p class="muted">순차/병렬, 집계, 타임아웃, 재시도 패턴을 가짜 API로 실험합니다.</p>

    <section class="grid">
      <div class="card">
        <h2>① 순차 실행</h2>
        <button id="seqBtn">task1 → task2 → task3</button>
        <div id="seqLog" class="log"></div>
      </div>

      <div class="card">
        <h2>② 병렬 실행 (Promise.all)</h2>
        <button id="parBtn">user & posts & comments</button>
        <div id="parLog" class="log"></div>
      </div>

      <div class="card">
        <h2>③ 집계 비교</h2>
        <button id="aggBtn">all / allSettled / any / race</button>
        <div id="aggLog" class="log"></div>
      </div>

      <div class="card">
        <h2>④ 타임아웃 & 재시도</h2>
        <label>타임아웃(ms)</label>
        <input id="timeoutMs" type="number" value="800" />
        <button id="timeoutBtn">withTimeout</button>
        <button id="retryBtn">retry(3회, 지수 백오프)</button>
        <div id="robLog" class="log"></div>
      </div>
    </section>

    <p class="muted" style="margin-top:16px">
      팁: 콘솔에서도 로그가 출력됩니다. (Windows: <code>Ctrl+Shift+I</code>, macOS: <code>⌥⌘I</code>)
    </p>
  </main>
</body>
</html>
