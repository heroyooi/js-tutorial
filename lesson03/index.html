<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>JS 3회차 – 연산자 플레이그라운드</title>
  <script defer src="app.js"></script>
  <style>
    :root {
      --bg:#0f1115; --card:#151923; --text:#e6e8ee; --muted:#aeb3c2; --border:#2a2f3a; --focus:#4f8cff;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui, Noto Sans KR, sans-serif}
    .container{max-width:900px;margin:48px auto;padding:0 20px}
    h1{margin:0 0 8px}
    p.muted{color:var(--muted);margin:0 0 16px}
    .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
    label{display:block;margin-bottom:8px}
    input[type="text"],input[type="number"]{
      width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;background:#0f1420;color:var(--text);
    }
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    button{
      border:1px solid var(--border);background:#1d2330;color:var(--text);
      padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:600
    }
    button:hover{border-color:var(--focus)}
    .result{margin-top:10px;padding:10px;border:1px dashed var(--border);border-radius:10px;background:#111726;min-height:38px}
    code{background:#0f1420;padding:2px 6px;border-radius:6px}
  </style>
</head>
<body>
  <main class="container">
    <h1>JavaScript 3회차 – 연산자 플레이그라운드</h1>
    <p class="muted">입력값을 바꿔 보세요. 콘솔도 함께 확인하면 더 좋습니다.</p>

    <section class="grid">
      <!-- 산술 -->
      <div class="card">
        <h2>① 산술</h2>
        <div class="row">
          <input id="a" type="number" placeholder="a" />
          <input id="b" type="number" placeholder="b" />
          <button id="calcBtn">계산</button>
        </div>
        <div id="arithResult" class="result"></div>
        <p class="muted">거듭제곱: <code>a ** b</code>, 나머지: <code>a % b</code></p>
      </div>

      <!-- 비교 -->
      <div class="card">
        <h2>② 비교</h2>
        <label>왼쪽 값(문자열 허용)<input id="left" type="text" placeholder="예: 5 혹은 '5'"/></label>
        <label>오른쪽 값(문자열 허용)<input id="right" type="text" placeholder="예: 5 혹은 '5'"/></label>
        <div class="row">
          <button id="eqBtn">==</button>
          <button id="seqBtn">===</button>
          <button id="ltBtn">&lt;</button>
          <button id="gtBtn">&gt;</button>
        </div>
        <div id="cmpResult" class="result"></div>
        <p class="muted"><strong>권장:</strong> 항상 <code>===</code> 사용, 필요 시 명시적 변환</p>
      </div>

      <!-- 논리/단락 & Nullish -->
      <div class="card">
        <h2>③ 논리/기본값</h2>
        <label>입력 값(빈 문자열/0/false도 테스트)<input id="maybe" type="text" placeholder='예: "", 0, false, null, undefined'/></label>
        <div class="row">
          <button id="orBtn">A || "기본"</button>
          <button id="nullishBtn">A ?? "기본"</button>
          <button id="notBtn">!A</button>
        </div>
        <div id="logicResult" class="result"></div>
        <p class="muted"><code>||</code>는 falsy 전체를, <code>??</code>는 <em>null/undefined만</em> 대체합니다.</p>
      </div>

      <!-- 삼항 -->
      <div class="card">
        <h2>④ 조건(삼항)</h2>
        <label>점수(0~100)<input id="score" type="number" min="0" max="100" placeholder="예: 87"/></label>
        <button id="gradeBtn">학점 계산</button>
        <div id="ternaryResult" class="result"></div>
        <p class="muted">중첩 삼항이 복잡해지면 <code>if/else</code>로 바꾸세요.</p>
      </div>
    </section>
  </main>
</body>
</html>
