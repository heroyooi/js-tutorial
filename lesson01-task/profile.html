<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>JS 중급 1회차 – 프로필 카드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --accent: #60a5fa;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --ok: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans KR, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 700px at 10% -10%, #1e293b 0%, #0b1222 40%, #050816 100%), var(--bg);
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .wrap {
      width: 100%;
      max-width: 880px;
      display: grid;
      gap: 20px;
    }
    header h1 {
      margin: 0;
      font-weight: 800;
      letter-spacing: -0.02em;
      font-size: clamp(22px, 4vw, 30px);
    }
    header p { margin: 4px 0 0; color: var(--muted); }

    .card {
      background: linear-gradient(180deg, rgba(96,165,250,0.06), rgba(96,165,250,0.02));
      border: 1px solid rgba(96,165,250,0.25);
      border-radius: 16px;
      padding: 22px;
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 16px;
      box-shadow: 0 10px 40px rgba(2,6,23,0.45), inset 0 0 0 1px rgba(255,255,255,0.03);
      backdrop-filter: blur(6px);
    }
    .avatar {
      width: 88px; height: 88px; border-radius: 50%;
      background: #0b1222;
      border: 1px solid rgba(148,163,184,0.25);
      display: grid; place-items: center;
      font-weight: 800; font-size: 28px; letter-spacing: -0.03em;
      color: #c7d2fe;
      user-select: none;
    }
    .info h2 {
      margin: 2px 0 6px;
      font-size: 22px;
      letter-spacing: -0.02em;
    }
    .meta {
      display: flex; flex-wrap: wrap; gap: 8px 12px; color: var(--muted);
      font-size: 14px;
    }
    .meta span::before { content: "• "; color: #475569; margin-right: 6px; }
    .meta span:first-child::before { content: ""; margin: 0; }
    .badges { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
    .badge {
      border: 1px dashed rgba(96,165,250,0.35);
      background: rgba(59,130,246,0.08);
      color: #cfe6ff;
      padding: 6px 10px; border-radius: 999px; font-size: 12px;
    }

    .controls {
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    button {
      all: unset;
      background: linear-gradient(180deg, rgba(59,130,246,0.18), rgba(59,130,246,0.08));
      border: 1px solid rgba(96,165,250,0.35);
      color: #eaf2ff; padding: 10px 14px; border-radius: 10px;
      cursor: pointer; font-weight: 600;
      transition: transform .08s ease, background .2s ease, box-shadow .2s ease;
      box-shadow: 0 4px 18px rgba(2,6,23,0.45);
    }
    button:hover { transform: translateY(-1px); }
    .ghost {
      background: transparent; border-style: dashed; color: #cbd5e1;
    }
    .ok {
      background: linear-gradient(180deg, rgba(34,197,94,0.2), rgba(34,197,94,0.08));
      border-color: rgba(34,197,94,0.4); color: #d1fae5;
    }
    .hint {
      margin-top: 8px; color: var(--muted); font-size: 13px;
    }
    footer { margin-top: 8px; color: var(--muted); font-size: 13px; text-align: right; }
    code { background: rgba(15,23,42,0.6); border: 1px solid rgba(148,163,184,0.2); padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>프로필 카드 – 템플릿 리터럴 & 화살표 함수</h1>
      <p>ES6 문법( <code>const</code>, <code>let</code>, 템플릿 리터럴, 화살표 함수 )로 동적 UI 만들기</p>
    </header>

    <section id="profile" class="card" aria-live="polite">
      <!-- JS가 내용을 채웁니다 -->
    </section>

    <section class="controls">
      <button id="nextBtn">다음 프로필 ▶</button>
      <button id="randomBtn" class="ghost">랜덤 프로필 🎲</button>
      <button id="updateBtn" class="ok">현재 프로필 직업 바꾸기</button>
    </section>
    <p class="hint">힌트: 콘솔을 열어(<code>F12</code>) 이벤트 로그를 확인해보세요.</p>

    <footer>© FE 스쿨 · JS 중급 1회차</footer>
  </main>

  <script>
    // ✅ 데이터: const로 상수(참조) 고정, 내부값은 필요 시 변경
    const profiles = [
      { name: "홍길동", age: 28, job: "프론트엔드 개발자", city: "서울", skills: ["JavaScript", "React", "Remix"] },
      { name: "김영희", age: 31, job: "퍼블리셔", city: "부산", skills: ["HTML", "CSS", "SCSS"] },
      { name: "이철수", age: 26, job: "백엔드 개발자", city: "대구", skills: ["Node.js", "Express", "MongoDB"] },
      { name: "박민수", age: 35, job: "풀스택", city: "인천", skills: ["Vue", "Firebase", "Cloud Functions"] }
    ];

    let currentIndex = 0; // ✅ let: 변하는 값

    // 이니셜(아바타 텍스트) 생성 – 화살표 함수 + 템플릿 리터럴
    const getInitial = name => name?.[0] ?? "?";

    // 카드 HTML 생성 – 템플릿 리터럴
    const renderCard = ({ name, age, job, city, skills }) => `
      <div class="avatar" aria-hidden="true">${getInitial(name)}</div>
      <div class="info">
        <h2>${name}</h2>
        <div class="meta">
          <span>나이 ${age}세</span>
          <span>${job}</span>
          <span>${city} 거주</span>
        </div>
        <div class="badges">
          ${skills.map(s => `<span class="badge"># ${s}</span>`).join("")}
        </div>
      </div>
    `;

    const $profile = document.getElementById("profile");
    const $next = document.getElementById("nextBtn");
    const $random = document.getElementById("randomBtn");
    const $update = document.getElementById("updateBtn");

    // 현재 인덱스의 프로필을 렌더
    const renderCurrent = () => {
      const model = profiles[currentIndex];
      $profile.innerHTML = renderCard(model);
      console.log(`[render] index=${currentIndex}`, model);
    };

    // 다음 프로필로 이동
    const nextProfile = () => {
      currentIndex = (currentIndex + 1) % profiles.length;
      renderCurrent();
    };

    // 랜덤 프로필로 이동
    const randomProfile = () => {
      let r = Math.floor(Math.random() * profiles.length);
      if (r === currentIndex) r = (r + 1) % profiles.length; // 같은 값 방지
      currentIndex = r;
      renderCurrent();
    };

    // 현재 프로필의 직업(job)만 변경 (const 객체 내부 변경 가능 시연)
    const updateCurrentJob = () => {
      const jobs = ["프론트엔드", "백엔드", "풀스택", "퍼블리셔", "데브옵스"];
      const target = profiles[currentIndex];
      const nextJob = jobs[Math.floor(Math.random() * jobs.length)];
      target.job = nextJob; // ✅ const 참조는 그대로, 내부 속성만 변경
      console.log(`[update] ${target.name}의 직업 → ${nextJob}`);
      renderCurrent();
    };

    // 이벤트 리스너 (화살표 함수)
    $next.addEventListener("click", () => nextProfile());
    $random.addEventListener("click", () => randomProfile());
    $update.addEventListener("click", () => updateCurrentJob());

    // 초기 렌더 – defer 덕분에 DOM 준비 후 실행
    renderCurrent();
  </script>
</body>
</html>
